:root{color-scheme:dark;--bg:#090e1b;--panel:#151e32;--line:#ffffff1e;--muted:#aebbd4;--green:#4be5aa}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:radial-gradient(circle at 50% -20%,#24447c,#090e1b 52%);color:white}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}button:disabled{opacity:.45;cursor:default}.app{height:100dvh;max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;gap:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:1000;font-size:clamp(20px,5vw,28px);letter-spacing:-1px}.sub{font-size:10px;color:var(--muted)}.smallbtn{border-radius:12px;background:#ffffff19;padding:9px 11px;font-size:12px}.hero{border:1px solid #ffffff29;border-radius:23px;background:linear-gradient(145deg,#1b2942,#101727);padding:12px 14px;text-align:center;box-shadow:0 12px 30px #0005}.eyebrow{font-size:11px;color:var(--muted)}.money{font-size:clamp(35px,10vw,55px);font-weight:1000;color:var(--green);letter-spacing:-2px;line-height:1.15;margin:4px 0}.chips{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.chip{border:1px solid #ffffff25;background:#ffffff13;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800}.progress{height:7px;background:#ffffff1a;border-radius:20px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:linear-gradient(90deg,#36d9a0,#f4e88c);width:1%;transition:width .2s}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:9px 7px;text-align:center}.metric b{display:block;font-size:14px}.metric span{font-size:10px;color:var(--muted)}.market{display:flex;gap:8px;align-items:center;background:#ffffff0c;border:1px solid var(--line);border-radius:13px;padding:9px 11px;min-height:38px}.market strong{font-size:12px;white-space:nowrap}.market span{font-size:11px;color:#d1daee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,91px);gap:8px}.action{text-align:left;padding:12px;border-radius:19px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 1px #ffffff35,0 9px 20px #0004;transition:transform .08s}.action:active{transform:scale(.97)}.action b{font-size:clamp(14px,4vw,18px);line-height:1.2}.action span{font-size:10px;line-height:1.4}.work{background:linear-gradient(125deg,#2563eb,#17316c)}.invest{background:linear-gradient(125deg,#079669,#064e3b)}.poker{background:linear-gradient(125deg,#e33b70,#7d174f)}.biz{background:linear-gradient(125deg,#f5c84c,#d77c25);color:#201506}.ticker{border:1px solid var(--line);background:#ffffff0e;border-radius:12px;padding:10px 12px;min-height:37px;font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.feed{flex:1;min-height:100px;border:1px solid var(--line);background:#111a2b;border-radius:17px;padding:8px;display:flex;flex-direction:column;overflow:hidden}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}.tabs button{background:#ffffff15;border-radius:10px;padding:8px 3px;font-size:11px;font-weight:900}.tabs button.active{background:#f5f7ff;color:#172033}.pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}.entry{padding:8px 9px;margin-bottom:6px;border:1px solid #ffffff14;background:#ffffff0b;border-radius:11px;font-size:11px;line-height:1.5}.entry.good{border-color:#39dc9e50}.entry.bad{border-color:#fb718550}.entry.rare{border-color:#ffd16670;background:#e9b94916}.entry small{color:var(--muted)}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:20;backdrop-filter:blur(9px)}.overlay.show{display:flex}.modal{width:min(100%,465px);max-height:90dvh;overflow:auto;background:linear-gradient(145deg,#26304b,#111827);border:1px solid #ffffff36;border-radius:25px;padding:19px;text-align:center;box-shadow:0 20px 90px #000b}.modal .emoji{font-size:56px}.modal h2{margin:6px 0;font-size:25px}.modal p{font-size:13px;line-height:1.6;color:#dfe7fa}.result{margin:12px 0;text-align:left}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.resultgrid>div{min-width:0;border:1px solid var(--line);background:#ffffff0c;padding:9px;border-radius:12px}.resultgrid small{display:block;color:var(--muted);font-size:10px}.resultgrid b{font-size:14px;overflow-wrap:anywhere}.story{border:1px solid var(--line);background:#ffffff0b;padding:10px;border-radius:12px;margin-top:8px;font-size:12px;line-height:1.6;overflow-wrap:anywhere}.resultbuttons{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.resultbuttons button,.primary{border-radius:12px;padding:11px;background:#4d73ec;font-size:12px;font-weight:900}.resultbuttons .line{background:#06c755}.resultbuttons .yellow{background:#facc15;color:#191919}.resultbuttons .dark{background:#ffffff21}.save{display:flex;gap:6px;margin-top:10px}.save input{flex:1;min-width:0;background:#ffffff14;border:1px solid #ffffff2e;color:white;border-radius:11px;padding:10px}.save button{background:#facc15;color:#171717;border-radius:11px;padding:9px;font-weight:900}.notice{font-size:10px;color:#b8c4da;margin-top:7px}.spark{position:fixed;pointer-events:none;inset:0;z-index:30;overflow:hidden}.particle{position:absolute;top:50%;left:50%;animation:fly 1.1s forwards;transform:translate(-50%,-50%)}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(500deg);opacity:0}}@media(max-height:730px){.app{gap:5px}.hero{padding:8px 12px}.money{font-size:clamp(30px,8vw,45px)}.actions{grid-template-rows:repeat(2,77px);gap:6px}.action{padding:9px}.metric{padding:6px}.market{padding:7px}.ticker{padding:8px}.feed{padding:6px}}@media(max-height:610px){.metrics </style></head><body><main class="app"><header class="top"><div><div class="brand">💰 資本主義ゲーム <small style="font-size:11px;color:#ffdf87">2.0</small></div><div class="sub">120ヶ月で1億円。あなたならどう稼ぐ？</div></div><button class="smallbtn" id="restart">↻ 最初から</button></header><section class="hero"><div class="eyebrow">現在の純資産</div><div class="money" id="money">100万円</div><div class="chips"><span class="chip" id="month">0 / 120ヶ月</span><span class="chip" id="best">最速記録 —</span><span class="chip" id="style">挑戦者</span></div><div class="progress"><div id="progress"></div></div></section><section class="metrics"><div class="metric"><b id="salary">30万円</b><span>月給</span></div><div class="metric"><b id="level">Lv.0</b><span>事業レベル</span></div><div class="metric"><b id="risk">低</b><span>リスク傾向</span></div></section><div class="market"><strong id="marketName">📊 通常経済</strong><span id="marketDesc">景気は安定している</span></div><section class="actions"><button class="action work" data-action="work"><b>💼 労働する</b><span id="workHint">月給30万円＋半年ボーナス</span></button><button class="action invest" data-action="invest"><b>📈 投資する</b><span>複利で増やす。暴落に注意</span></button><button class="action poker" data-action="poker"><b>🃏 ポーカー大会に出場</b><span id="pokerHint">入賞率15%・優勝で大逆転</span></button><button class="action biz" data-action="biz"><b>🚀 起業する</b><span id="bizHint">初期費用あり・事業を育てる</span></button></section><div class="ticker" id="ticker">🎮 100万円を元手に人生をスタート！</div><section class="feed"><div class="tabs"><button data-tab="log" class="active">📜 ログ</button><button data-tab="ach">🏆 実績</button><button data-tab="rank">🥇 記録</button><button data-tab="help">❔ 説明</button></div><div class="pane" id="pane"></div></section></main><div class="overlay" id="overlay"><div class="modal" id="modal"><div class="emoji" id="modalEmoji"></div><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalExtra"></div><div id="modalControls"></div></div></div><div class="spark" id="spark"></div><script>
'use strict';
(()=>{
const TARGET=100000000,START=1000000,LIMIT=120,KEY='capitalism-v2-rankings';
const $=id=>document.getElementById(id);
const moneyText=n=>{const v=Math.round(n);if(Math.abs(v)>=1e8)return (v/1e8).toFixed(2).replace(/\.00$/,'')+'億円';if(Math.abs(v)>=1e4)return (v/1e4).toFixed(1).replace(/\.0$/,'')+'万円';return v.toLocaleString('ja-JP')+'円'};
const exact=n=>Math.round(n).toLocaleString('ja-JP')+'円';
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const random=(a,b)=>a+Math.random()*(b-a);
const sample=arr=>arr[Math.floor(Math.random()*arr.length)];
let state,tab='log',modalType=null,finalData=null,events=[];
function initial(){return {cash:START,month:0,salary:300000,level:0,peak:START,maxGain:0,maxLoss:0,counts:{work:0,invest:0,poker:0,biz:0},rare:0,crashes:0,incidents:0,history:[{month:0,text:'100万円からスタート。最速1億円を目指せ！',tone:''}],market:'normal',ended:false,retirement:false,achievements:{},last:'🎮 100万円を元手に人生をスタート！',lossStreak:0,highestPoker:0};}
function rankings(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function saveRankings(rows){try{localStorage.setItem(KEY,JSON.stringify(rows.slice(0,30)));return true}catch{return false}}
function leader(){return rankings().filter(x=>x.clear).sort((a,b)=>a.month-b.month)[0]||null}
function actionStyle(){const a=Object.entries(state.counts).sort((a,b)=>b[1]-a[1]);if(!a[0][1])return '挑戦者';if(a[0][1]===a[1][1])return 'バランス型';return {work:'労働型',invest:'投資型',poker:'ポーカー勝負師',biz:'起業家'}[a[0][0]]}
function push(text,tone=''){state.history.unshift({month:state.month,text,tone});state.history=state.history.slice(0,80);state.last=text}
function change(amount){const before=state.cash;state.cash=Math.round(before+amount);state.peak=Math.max(state.peak,state.cash);state.maxGain=Math.max(state.maxGain,state.cash-before);state.maxLoss=Math.max(state.maxLoss,before-state.cash)}
function gameOver(){return state.ended||state.month>=LIMIT||state.cash<=0||state.cash>=TARGET}
function pokerFee(){return Math.max(50000,Math.round(Math.min(state.cash*.09,Math.max(100000,state.cash*.065))/10000)*10000)}
function economy(){const r=Math.random();state.market=r<.1?'boom':r<.18?'recession':r<.24?'inflation':'normal';const m={boom:['🚀 好景気','投資と起業に追い風'],recession:['📉 不況','投資と起業が苦戦'],inflation:['🔥 物価高','突発支出が増える'],normal:['📊 通常経済','景気は安定している']}[state.market];$('marketName').textContent=m[0];$('marketDesc').textContent=m[1]}
function particles(bad=false){const root=$('spark');root.replaceChildren();for(let i=0;i<40;i++){const p=document.createElement('span');p.className='particle';p.textContent=bad?sample(['📉','💸','▼']):sample(['✨','💰','🎉','🪙']);const angle=random(0,Math.PI*2),radius=random(80,350);p.style.setProperty('--x',Math.cos(angle)*radius+'px');p.style.setProperty('--y',Math.sin(angle)*radius+'px');p.style.animationDelay=random(0,.2)+'s';root.append(p)}setTimeout(()=>root.replaceChildren(),1500)}
function openModal(type,emoji,title,text,extra='',controls=''){modalType=type;$('modalEmoji').textContent=emoji;$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalExtra').innerHTML=extra;$('modalControls').innerHTML=controls;$('overlay').classList.add('show')}
function closeModal(){if(modalType==='final')return;$('overlay').classList.remove('show');modalType=null}
$('overlay').addEventListener('click',e=>{if(modalType!=='final')closeModal()});$('modal').addEventListener('click',e=>{if(modalType!=='final')closeModal();else e.stopPropagation()});
function announce(emoji,title,text,bad=false){events.push({emoji,title,text,bad})}
function nextAnnouncement(){if(state.ended||modalType==='final'){events=[];return}const e=events.shift();if(!e)return;particles(e.bad);openModal('event',e.emoji,e.title,e.text)}
function work(){state.counts.work++;let earn=state.salary;let text='💼 給料 '+exact(state.salary)+' を獲得';if(state.month%6===0){const bonus=Math.round(state.salary*random(1.2,1.9));earn+=bonus;text+='＋賞与 '+exact(bonus)}change(earn);if(state.month%12===0){const old=state.salary;state.salary=Math.round(old*(1+sample([0,.025,.035,.05,.07])));text+='。新月給 '+moneyText(state.salary);if(state.salary>old)announce('📈','昇給！','努力が評価され、月給が '+moneyText(state.salary)+' にアップ')}push(text,'good')}
function invest(){state.counts.invest++;const r=Math.random();let rate,tone='good',text='';const boost=state.market==='boom'?.025:state.market==='recession'?-.025:0;if(r<.025){rate=-random(.18,.36);tone='bad';text='📉 市場暴落';state.crashes++;announce('📉','マーケット暴落','市場が急落！ 投資資産に大きな損失が発生した。',true)}else if(r<.18){rate=-random(.008,.055)+boost;out();}else if(r<.78){rate=random(.004,.018)+boost;out()}else if(r<.965){rate=random(.025,.06)+boost;out()}else{rate=random(.10,.21)+boost;state.rare++;announce('🌕','バブル相場！','市場が急騰！ 大きな利益が生まれた');out()}function out(){text=rate<0?'📉 投資が下落':'📈 投資が上昇';tone=rate<0?'bad':'good'}const delta=Math.round(state.cash*rate);change(delta);push(text+' '+(delta>=0?'+':'')+exact(delta)+'（'+(rate*100).toFixed(1)+'%）',tone)}
function poker(){state.counts.poker++;const fee=pokerFee();const r=Math.random();change(-fee);let prize=0,label='予選敗退',tone='bad';const multiplier=Math.sqrt(fee/100000);if(r<.008){prize=Math.round(random(10000000,20000000)*multiplier);label='🏆 トーナメント優勝！';tone='rare';state.highestPoker++;state.rare++;announce('🏆','ポーカー大会優勝！','激戦を勝ち抜き、優勝賞金 '+moneyText(prize)+' を獲得！')}else if(r<.035){prize=Math.round(random(2500000,6500000)*multiplier);label='🥈 ファイナルテーブル進出';tone='rare';state.rare++;announce('🃏','ファイナルテーブル！','上位入賞で '+moneyText(prize)+' を獲得！')}else if(r<.15){prize=Math.round(random(220000,950000)*multiplier);label='🃏 入賞';tone='good'}if(prize){change(prize);state.lossStreak=0}else state.lossStreak++;push(label+'｜参加費 '+moneyText(fee)+' / 賞金 '+moneyText(prize),tone)}
function business(){state.counts.biz++;const cost=220000+state.level*75000;change(-cost);const r=Math.random(),lv=state.level;let revenue=0,tone='good',label='';if(r<.045&&lv>=2){revenue=-random(1400000,5500000)-lv*200000;state.level=Math.max(0,lv-2);tone='bad';label='🧾 税務・契約トラブル';state.rare++;announce('🧾','事業トラブル','契約問題と追徴支出で多額の損失。事業レベルも低下した。',true)}else if(r<.085&&lv>=1){revenue=-random(650000,2700000);state.level=Math.max(0,lv-1);tone='bad';label='🔥 炎上・設備事故';state.rare++;announce('🔥','事業に事故発生','設備と評判の立て直しに費用がかかった。',true)}else if(r<.35){revenue=-random(30000,450000);state.level=Math.max(0,lv-1);tone='bad';label='📉 赤字月'}else if(r<.76){revenue=random(180000,650000)+lv*145000;state.level=Math.min(9,lv+1);label='🏪 事業が黒字'}else if(r<.96){revenue=random(700000,1650000)+lv*320000;state.level=Math.min(9,lv+1);label='🚀 事業急成長';state.rare++;announce('🚀','事業急成長','口コミと新規契約が増加！ 事業レベルが上がった')}else{revenue=random(2000000,4500000)+lv*520000;state.level=Math.min(9,lv+2);label='🌟 大型契約獲得';tone='rare';state.rare++;announce('🌟','大型契約獲得！','長年の仕込みが実り、大型案件を受注した')}if(state.market==='boom'&&revenue>0)revenue*=1.25;if(state.market==='recession'&&revenue>0)revenue*=.65;change(Math.round(revenue));push(label+'｜経費 '+moneyText(cost)+' / 売上損益 '+moneyText(revenue),tone)}
function incident(){
 const r=Math.random();let amount=0,label='',emoji='🎲',title='',tone='bad';
 const pool=[
  {w:1.5,emoji:'🚑',title:'突然の休養',label:'体調を崩して仕事を休む',amount:()=>-random(120000,580000)},
  {w:1.4,emoji:'🏠',title:'修繕ラッシュ',label:'家電と住居設備が同時に故障',amount:()=>-random(180000,980000)},
  {w:1.0,emoji:'🕳️',title:'投資詐欺',label:'怪しい儲け話に引っかかる',amount:()=>-Math.max(120000,state.cash*random(.025,.095))},
  {w:.9,emoji:'🧾',title:'税金の落とし穴',label:'想定外の税負担',amount:()=>-Math.max(140000,state.cash*random(.035,.11))},
  {w:.9,emoji:'🚗',title:'交通トラブル',label:'急な移動費と修理費',amount:()=>-random(90000,490000)},
  {w:.8,emoji:'📱',title:'データ消失',label:'仕事用端末の故障と復旧費',amount:()=>-random(80000,370000)},
  {w:.8,emoji:'🏥',title:'家族のサポート',label:'家族を助けるための出費',amount:()=>-random(150000,850000)},
  {w:.7,emoji:'📦',title:'契約トラブル',label:'契約解除に伴う違約金',amount:()=>-random(130000,650000)},
  {w:.7,emoji:'🌀',title:'災害による損害',label:'突発的な災害対応',amount:()=>-random(250000,1200000)},
  {w:.8,emoji:'🎁',title:'思わぬ臨時収入',label:'忘れていた返金と臨時収入',amount:()=>random(80000,380000)},
  {w:.7,emoji:'🏅',title:'副賞を獲得',label:'コンテストの賞金',amount:()=>random(150000,800000)},
  {w:.5,emoji:'🤝',title:'紹介料が入金',label:'過去の紹介案件から報酬',amount:()=>random(200000,1000000)},
  {w:.4,emoji:'🎫',title:'幸運な当選',label:'キャンペーンの当選賞金',amount:()=>random(300000,1600000)},
  {w:.3,emoji:'🏛️',title:'思わぬ相続',label:'遠縁から資産の一部を相続',amount:()=>random(900000,3500000)}
 ];
 const chance=state.market==='inflation'?.11:.085;
 if(r>=chance)return;
 const total=pool.reduce((n,e)=>n+e.w,0);let pick=random(0,total),e=pool[0];
 for(const item of pool){pick-=item.w;if(pick<=0){e=item;break}}
 amount=Math.round(e.amount());if(amount<0&&state.market==='inflation')amount=Math.round(amount*1.2);
 change(amount);state.incidents++;if(amount>0)state.rare++;
 tone=amount>0?'rare':'bad';label=e.label;emoji=e.emoji;title=e.title;
 push(emoji+' '+label+'：'+(amount>0?'+':'')+moneyText(amount),tone);
 if(state.cash>0&&state.cash<TARGET)announce(emoji,title,label+'。資産が'+(amount>0?'増加':'減少')+'（'+moneyText(Math.abs(amount))+'）',amount<0);
}
function achievements(){const tests=[['million',state.cash>=10000000,'💎','資産1,000万円'],['half',state.cash>=50000000,'🏙️','資産5,000万円'],['founder',state.level>=5,'🏢','事業レベル5'],['poker',state.highestPoker>0,'🏆','ポーカー大会優勝'],['survivor',state.crashes>0&&state.cash>=START,'🛡️','暴落から生還'],['worker',state.counts.work>=24&&state.counts.work===state.month,'👔','労働一筋24ヶ月']];for(const [id,yes,emoji,title] of tests){if(yes&&!state.achievements[id]){state.achievements[id]=true;if(!gameOver())announce(emoji,'実績解除！',title)}}}
function turn(action){if(gameOver()||modalType)return;state.month++;events=[];if(state.month===1||state.month%6===1)economy();({work,invest,poker,biz:business})[action]();incident();achievements();if(state.cash>=TARGET||state.cash<=0||state.month>=LIMIT){finish();return}render();nextAnnouncement()}
function diagnosis(){const s=actionStyle();const map={'労働型':['堅実な積み上げ職人','安定を選び、信用を積み上げる。危険な勝負より継続力が武器。','堅実な経営者・職人タイプ'],'投資型':['複利を信じる長期投資家','時間を味方にする一方、暴落時の冷静さが問われる。','ウォーレン・バフェット型'],'ポーカー勝負師':['逆転を狙う勝負師','負けが続いても勝負を降りない。爆発力と破産リスクが表裏一体。','プロポーカープレイヤー型'],'起業家':['リスクを背負う開拓者','事業の赤字を受け止めて成長を追う。大きな成功と失敗を経験する。','孫正義・イーロン・マスク型'],'バランス型':['柔軟な現実主義者','一つの手段に固執せず、局面ごとに戦略を変える。','複数事業を運営する投資家型'],'挑戦者':['これからの挑戦者','どの道を選ぶかはあなた次第。','未来の経営者型']};return map[s]}
function story(){const d=diagnosis(),style=actionStyle();let text='あなたは '+state.month+'ヶ月間、'+style+'として資産形成に挑んだ。';if(state.cash>=TARGET)text+='ついに1億円を突破した。';else if(state.cash<=0)text+='しかし資金が尽き、破産という結末を迎えた。';else text+='時間切れとなり、最終資産は '+moneyText(state.cash)+'。';if(state.crashes)text+='暴落 '+state.crashes+'回を経験。';if(state.highestPoker)text+='ポーカー大会で優勝という伝説も残した。';if(state.incidents)text+='突発支出 '+state.incidents+'回にも見舞われた。';return text}
function finish(){if(state.ended)return;state.ended=true;events=[];const allWork=state.counts.work===state.month;if(state.cash<TARGET&&state.cash>0&&allWork){const bonus=Math.round(state.salary*8);change(bonus);state.retirement=true;push('👔 労働一筋の退職金 '+moneyText(bonus)+' を受け取った','good')}const clear=state.cash>=TARGET;const bankrupt=state.cash<=0;const d=diagnosis();finalData={clear,bankrupt,month:state.month,cash:state.cash,style:actionStyle(),date:new Date().toLocaleDateString('ja-JP'),peak:state.peak,gain:state.maxGain,loss:state.maxLoss,counts:{...state.counts},rare:state.rare,incidents:state.incidents,crashes:state.crashes,diagnosis:d,story:story()};render();particles(bankrupt);const title=clear?'🎉 1億円達成！':bankrupt?'💸 破産エンド':'⌛ 120ヶ月終了';const grid=[['最終資産',moneyText(state.cash)],['経過',state.month+'ヶ月'],['最大資産',moneyText(state.peak)],['最大増加',moneyText(state.maxGain)],['最大損失',moneyText(state.maxLoss)],['ポーカー優勝',state.highestPoker+'回']].map(([a,b])=>'<div><small>'+a+'</small><b>'+b+'</b></div>').join('');const extra='<div class="result"><div class="resultgrid">'+grid+'</div><div class="story"><b>🧠 性格診断：'+escapeHTML(d[0])+'</b><br>'+escapeHTML(d[1])+'<br><b>似ているタイプ：</b>'+escapeHTML(d[2])+'</div><div class="story"><b>📖 あなたの人生</b><br>'+escapeHTML(finalData.story)+'</div><div class="story"><b>行動履歴</b><br>労働 '+state.counts.work+'回 / 投資 '+state.counts.invest+'回 / ポーカー '+state.counts.poker+'回 / 起業 '+state.counts.biz+'回<br>レアイベント '+state.rare+'回 / 突発支出 '+state.incidents+'回</div></div>';const controls='<div class="save"><input id="playerName" maxlength="14" placeholder="ランキング登録名"><button id="saveResult">記録保存</button></div><div class="resultbuttons"><button id="shareNative">📲 共有</button><button id="shareLine" class="line">LINE</button><button id="shareX" class="dark">X</button><button id="copyResult" class="yellow">コピー</button><button id="saveImage" class="yellow">🖼️ 画像保存</button><button id="shareImage">📸 画像共有</button></div><div class="notice">画像保存はPNG形式。Instagramは「画像共有」から投稿先を選択できます（端末・ブラウザによっては画像保存後にInstagramで選択）。Xは文章共有にも対応。記録はこの端末内のみ。</div><button class="primary" style="margin-top:10px;width:100%" id="closeFinal">結果を閉じる</button>';openModal('final',clear?'👑':bankrupt?'💸':'⌛',title,clear?'あなたは '+state.month+'ヶ月で1億円を達成！':bankrupt?'資産が尽きた。次の人生ではどう戦う？':'1億円には届かなかった。次の人生で再挑戦！',extra,controls)}
function shareText(){const d=finalData;return '💰 資本主義ゲーム 2\n'+(d.clear?'🎉 1億円達成！':d.bankrupt?'💸 破産エンド':'⌛ 挑戦終了')+'\n経過：'+d.month+'ヶ月\n最終資産：'+moneyText(d.cash)+'\nタイプ：'+d.style+'\n性格診断：'+d.diagnosis[0]+'\n似ているタイプ：'+d.diagnosis[2]+'\n'+location.href}
function resultCanvas(){
 if(!finalData)throw Error('結果がありません');
 const d=finalData,c=document.createElement('canvas');c.width=1080;c.height=1350;
 const g=c.getContext('2d'),W=c.width,H=c.height;
 const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#172750');bg.addColorStop(.52,'#10182f');bg.addColorStop(1,'#080d1c');g.fillStyle=bg;g.fillRect(0,0,W,H);
 g.fillStyle='#60e9ac';g.fillRect(70,76,10,90);
 g.fillStyle='#e9f0ff';g.font='bold 51px system-ui,sans-serif';g.fillText('資本主義ゲーム',105,129);
 g.font='29px system-ui,sans-serif';g.fillStyle='#a9b7d6';g.fillText('MY CAPITALISM STORY  /  RESULT',78,201);
 const headline=d.clear?'1億円達成！':d.bankrupt?'破産エンド':'挑戦終了';
 g.font='bold 78px system-ui,sans-serif';g.fillStyle=d.clear?'#4df0a7':d.bankrupt?'#ff8d98':'#ffffff';g.fillText(headline,76,330);
 g.font='bold 40px system-ui,sans-serif';g.fillStyle='#ffffff';g.fillText('最終資産',78,422);
 g.font='bold 89px system-ui,sans-serif';g.fillStyle='#4df0a7';g.fillText(moneyText(d.cash),76,520);
 function roundRect(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
 const cells=[['到達まで',d.month+'ヶ月'],['プレイタイプ',d.style],['最大資産',moneyText(d.peak)],['ポーカー',d.counts.poker+'回']];
 cells.forEach((cell,i)=>{const x=76+(i%2)*477,y=588+Math.floor(i/2)*146;g.fillStyle='#ffffff13';roundRect(x,y,448,126,22);g.fill();g.fillStyle='#b5c4df';g.font='27px system-ui,sans-serif';g.fillText(cell[0],x+25,y+40);g.fillStyle='#fff';g.font='bold 37px system-ui,sans-serif';g.fillText(cell[1],x+25,y+91,405)});
 g.fillStyle='#ffffff13';roundRect(76,905,925,235,26);g.fill();
 g.fillStyle='#f6d879';g.font='bold 37px system-ui,sans-serif';g.fillText('性格診断',108,963);
 g.fillStyle='#ffffff';g.font='bold 44px system-ui,sans-serif';g.fillText(d.diagnosis[0],108,1024,830);
 g.fillStyle='#c7d2e7';g.font='30px system-ui,sans-serif';g.fillText('似ているタイプ：'+d.diagnosis[2],108,1080,830);
 g.fillStyle='#aab8d2';g.font='27px system-ui,sans-serif';g.fillText('あなたなら、何ヶ月で1億円？',76,1225);
 const url=location.protocol==='https:'?location.origin+location.pathname:'';
 if(url){g.font='24px system-ui,sans-serif';g.fillText(url,76,1270,900)}
 return c;
}
async function resultImageBlob(){return await new Promise((resolve,reject)=>resultCanvas().toBlob(b=>b?resolve(b):reject(Error('画像生成に失敗')),'image/png'))}
async function saveResultImage(){try{const blob=await resultImageBlob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='資本主義ゲーム_結果_'+finalData.month+'ヶ月.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){alert('画像保存に失敗しました：'+e.message)}}
async function shareResultImage(){try{const blob=await resultImageBlob(),file=new File([blob],'capitalism-result.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'資本主義ゲーム',text:'あなたは何ヶ月で1億円？'});}else{await saveResultImage();alert('画像を保存しました。InstagramやXで写真を選んで投稿してください。')}}catch(e){if(e.name!=='AbortError')alert('画像共有に失敗しました：'+e.message)}}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}const el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();return ok}catch{return false}}
$('modalControls').addEventListener('click',async e=>{const id=e.target.id;if(!finalData)return;if(id==='closeFinal'){$('overlay').classList.remove('show');modalType=null;tab='rank';render()}else if(id==='saveResult'){const name=$('playerName').value.trim()||'名無し';const rows=rankings();rows.push({...finalData,name});rows.sort((a,b)=>a.clear!==b.clear?(a.clear?-1:1):a.clear?a.month-b.month:b.cash-a.cash);const ok=saveRankings(rows);alert(ok?'この端末に記録を保存しました':'保存できませんでした。ブラウザの設定をご確認ください');render()}else if(id==='shareNative'){if(navigator.share){try{await navigator.share({title:'資本主義ゲーム 2',text:shareText()})}catch{}}else alert(await copyText(shareText())?'結果をコピーしました':'コピーできませんでした')}else if(id==='shareLine'){window.open('https://line.me/R/msg/text/?'+encodeURIComponent(shareText()),'_blank','noopener')}else if(id==='shareX'){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText()),'_blank','noopener')}else if(id==='copyResult')alert(await copyText(shareText())?'結果をコピーしました':'コピーできませんでした');else if(id==='saveImage')await saveResultImage();else if(id==='shareImage')await shareResultImage()});
function render(){const s=state;$('money').textContent=moneyText(s.cash);$('month').textContent=s.month+' / 120ヶ月';const b=leader();$('best').textContent=b?'最速 '+b.month+'ヶ月':'最速記録 —';$('style').textContent=actionStyle();$('progress').style.width=Math.max(0,Math.min(100,s.cash/TARGET*100))+'%';$('salary').textContent=moneyText(s.salary);$('level').textContent='Lv.'+s.level;$('risk').textContent=s.counts.poker+s.counts.biz>s.counts.work+s.counts.invest?'高':'低';$('workHint').textContent='月給 '+moneyText(s.salary)+'＋半年ボーナス';$('pokerHint').textContent='参加費 '+moneyText(pokerFee())+' / 入賞率15%';$('bizHint').textContent='経費 '+moneyText(220000+s.level*75000)+' / Lv.'+s.level;$('ticker').textContent=s.last;document.querySelectorAll('[data-action]').forEach(b=>b.disabled=s.ended);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='log')html=s.history.map(x=>'<div class="entry '+x.tone+'"><small>'+x.month+'ヶ月目</small> '+escapeHTML(x.text)+'</div>').join('');if(tab==='ach'){const a=[['million','💎 資産1,000万円'],['half','🏙️ 資産5,000万円'],['founder','🏢 事業Lv.5'],['poker','🏆 ポーカー大会優勝'],['survivor','🛡️ 暴落から生還'],['worker','👔 労働一筋24ヶ月']];html=a.map(([id,label])=>'<div class="entry">'+(s.achievements[id]?'✅':'⬜')+' '+label+'</div>').join('')}if(tab==='rank'){const rows=rankings().sort((a,b)=>a.clear!==b.clear?(a.clear?-1:1):a.clear?a.month-b.month:b.cash-a.cash);html=rows.length?rows.slice(0,30).map((x,i)=>'<div class="entry"><b>'+(i+1)+'位 '+escapeHTML(x.name)+'</b> ｜ '+(x.clear?'👑 クリア':'未達')+' ｜ '+x.month+'ヶ月<br><small>'+moneyText(x.cash)+' / '+escapeHTML(x.style||'')+'</small></div>').join(''):'<div class="entry">まだ記録がありません。ゲーム終了後に保存できます。</div>'}if(tab==='help')html=['🎯 目的：120ヶ月以内に純資産1億円。1回の行動で1ヶ月進みます。','💼 労働：初任給30万円。6ヶ月ごとに賞与、12ヶ月ごとに昇給。労働だけで最後まで続けると退職金。','📈 投資：保有資産全体が相場に連動。複利が強い一方、まれに大暴落。','🃏 ポーカー大会に出場：参加費は資産に連動。入賞率15%、その中でも優勝は非常に低確率。','🚀 起業：毎月経費がかかる。事業レベルで収益が成長。赤字や事故、税務トラブルも発生。','🌍 経済：半年ごとに景気が変化。好景気、不況、物価高などで収益や支出が変わる。','⚠️ 破産：資産が0円以下になると即終了。最終結果画面は閉じるボタン以外では消えません。','🏆 最速記録：この端末の保存済みクリア記録のみ。SNS共有で友達と競おう。','ℹ️ 確率と金額はゲームバランス用の創作値です。実際の投資・事業・ポーカーの収益率を示すものではありません。'].map(x=>'<div class="entry">'+x+'</div>').join('');$('pane').innerHTML=html}
function restart(){if(state&&!state.ended&&!confirm('現在のプレイを破棄して最初からやり直しますか？'))return;state=initial();events=[];modalType=null;finalData=null;tab='log';$('overlay').classList.remove('show');economy();render()}
$('restart').addEventListener('click',restart);document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>turn(b.dataset.action)));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));restart();
})();
</script></body></html>
